[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narration-recorder"
version = "0.1.0"
description = "Private LAN narration recorder with script-guided retakes and editable WAV exports"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
narration-recorder = "recorder.__main__:main"

[tool.setuptools.package-data]
recorder = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]